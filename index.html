<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Robux Portal PRO++</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <div class="sidebar">
    <button onclick="switchTab('home')">🏠 Home</button>
    <button onclick="switchTab('calculator')">📊 Calculator</button>
    <button onclick="switchTab('planner')">🎯 Goal Planner</button>
    <button onclick="switchTab('badges')">🏆 Badges</button>
    <button onclick="switchTab('chatbot')">🤖 Chatbot</button>
    <button onclick="switchTab('progress')">📈 Progress</button>
  </div>

  <div class="content">
    <div id="home" class="tab active"><h1>🏠 Welcome to Robux Portal PRO++</h1></div>

    <div id="calculator" class="tab">
      <h1>📊 Robux Calculator</h1>
      <input type="number" id="robuxInput" oninput="calcRobux()" placeholder="Enter Robux">
      <p id="roproValue">RoPro: $0.00</p>
      <p id="devexValue">DevEx: $0.00</p>
      <p id="buyingValue">Buying: $0.00</p>
      <canvas id="calcPie" width="300" height="300" style="border-radius:8px;"></canvas>
    </div>

    <div id="planner" class="tab">
      <h1>🎯 Goal Planner</h1>
      <input type="number" id="goalAmount" placeholder="Goal Robux">
      <input type="number" id="dailyAmount" placeholder="Daily Earn">
      <button onclick="calculateGoal()">Calculate</button>
      <p id="goalResult"></p>
    </div>

    <div id="badges" class="tab">
      <h1>🏆 Badge Collection</h1>
      <div id="badgeContainer"></div>
    </div>

    <div id="chatbot" class="tab">
      <h1>🤖 Chatbot Assistant</h1>
      <div id="chatLog" style="background:#1e1e1e;padding:10px;height:200px;overflow-y:auto;border-radius:8px;"></div>
      <input type="text" id="chatInput" placeholder="Ask me anything..." onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">Send</button>
      <button onclick="resetChat()" style="margin-left:10px;background:#f44336;">🔄 Reset Chat</button>
    </div>

    <div id="progress" class="tab">
      <div id="progressWrapper" style="background:#121212;padding:20px;border-radius:10px;text-align:left;">
        <div id="progressScreenshotHeader" style="display:none;" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <h2 style="font-size:20px;margin:0;">🚀 Robux Portal PRO++</h2>
          <span id="progressTimestamp" style="font-size:12px;color:#ccc;"></span>
        </div>
        <h3>🎯 Goal Progress</h3>
        <div id="goalBar" style="width:300px;height:20px;background:#333;border-radius:5px;">
          <div id="goalProgress" style="height:100%;width:0%;background:#4caf50;border-radius:5px;"></div>
        </div>
        <p id="goalText">Progress: 0 / 0 Robux (0%)</p>

        <h3>🏆 Badges Unlocked</h3>
        <p id="badgeProgressText">0 / 0 badges unlocked (0%)</p>

        <button onclick="shareProgress()" style="padding:10px 15px;background:#2196f3;color:white;border:none;border-radius:6px;">📤 Share Progress</button>
        <button onclick="copyToClipboard()" style="padding:10px 15px;background:#4caf50;color:white;border:none;border-radius:6px;margin-left:10px;">📋 Copy to Clipboard</button>
        <p id="shareStatus" style="margin-top:10px;color:#ccc;"></p>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
